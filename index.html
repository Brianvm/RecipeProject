<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <title>Grandma's Kitchen</title>
</head>
<body>
    <main>
            <h1>Grandma's Kitchen</h1>
            <input type="search" name="query" id="search_bar" placeholder="Which recipe are you looking for?">
            <button type="submit" id="search_button">Search</button>
            <button type="button" id="add_recipe_btn">New Recipe</button>
            <section class="hidden" id="search_results_container"></section>
            <dialog id="add_recipe_modal">
                <form action="" id="add_recipe_form">
                    <label for="recipe-name">Name:</label>
                    <input type="text" name="recipe-name" id="recipe_name">
                    <label for="recipe-prep-time">Prep Time:</label>
                    <input type="text" name="recipe-prep-time" id="recipe_prep_time">
                    <label for="recipe-cook-time">Cook Time:</label>
                    <input type="text" name="recipe-cook-time" id="recipe_cook_time">
                    <label for="recipe-servings">Servings:</label>
                    <input type="text" name="recipe-servings" id="recipe_servings">
                    <label for="recipe-preparation">Preparation</label>
                    <textarea name="recipe-preparation" id="recipe_preparation"></textarea>
                    <label for="recipe-ingredients">Ingredients</label>
                    <textarea name="recipe-ingredients" id="recipe_ingredients"></textarea>
                    <button type="reset" id="add_recipe_modal_cancel_btn">Cancel</button>
                    <button type="submit" id="add_recipe_modal_submit_btn">Save</button>
                </form>
            </dialog>
            <dialog id="clicked_recipe_modal"></dialog>
        <script src="script.js"></script>
    </main>
</body>
</html>

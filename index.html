<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="styles.css">
    <!-- <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pacifico&display=swap" rel="stylesheet"> -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Special+Elite&display=swap" rel="stylesheet">
    <title>Grandma's Kitchen</title>
</head>
<body>
    <main>
        <section id="hero">
            <h1 class="handwriting-header">Grandma's Kitchen</h1>   
            <section id="searchbar_container">
                <article id="search_input_wrapper">
                    <input type="search" name="query" id="search_bar" placeholder="Which recipe are you looking for?">
                    <button type="submit" id="search_button">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                        <circle cx="11" cy="11" r="7" stroke="#33363F" stroke-width="2"/>
                        <path d="M11 8C10.606 8 10.2159 8.0776 9.85195 8.22836C9.48797 8.37913 9.15726 8.6001 8.87868 8.87868C8.6001 9.15726 8.37913 9.48797 8.22836 9.85195C8.0776 10.2159 8 10.606 8 11" stroke="#33363F" stroke-width="2" stroke-linecap="round"/>
                        <path d="M20 20L17 17" stroke="#33363F" stroke-width="2" stroke-linecap="round"/>
                        </svg>
                    </button>
                </article>
                <button type="button" id="add_recipe_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                    <path d="M15 12L12 12M12 12L9 12M12 12L12 9M12 12L12 15" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                    <path d="M22 12C22 16.714 22 19.0711 20.5355 20.5355C19.0711 22 16.714 22 12 22C7.28595 22 4.92893 22 3.46447 20.5355C2 19.0711 2 16.714 2 12C2 7.28595 2 4.92893 3.46447 3.46447C4.92893 2 7.28595 2 12 2C16.714 2 19.0711 2 20.5355 3.46447C21.5093 4.43821 21.8356 5.80655 21.9449 8" stroke="#fff" stroke-width="1.5" stroke-linecap="round"/>
                    </svg>
                </button>
            </section>
        </section>
            
            <section class="hidden" id="search_results_container"></section>
            <dialog id="add_recipe_modal">
                <form action="" id="add_recipe_form">
                    <fieldset id="name">
                        <label for="recipe-name">Name:</label>
                        <input type="text" name="recipe-name" id="recipe_name" required>
                    </fieldset>
                    <fieldset id="extra_info">
                        <article class="detail">
                            <label class="detail_label" for="recipe-prep-time">Prep Time:</label>
                            <input type="text" name="recipe-prep-time" class="detail_input" id="recipe_prep_time">
                        </article>
                        <article class="detail">
                            <label class="detail_label" for="recipe-cook-time">Cook Time:</label>
                            <input type="text" name="recipe-cook-time" class="detail_input" id="recipe_cook_time">
                        </article>
                        <article class="detail">
                            <label class="detail_label" for="recipe-servings">Servings:</label>
                            <input type="text" name="recipe-servings" class="detail_input" id="recipe_servings">
                        </article>
                    </fieldset>
                    <fieldset id="recipe_prep">
                        <label for="recipe-preparation">Preparation:</label>
                        <textarea name="recipe-preparation" id="recipe_preparation" required></textarea>
                    </fieldset>
                    <fieldset id="ingredients">
                        <label for="recipe-ingredients">Ingredients:</label>
                        <textarea name="recipe-ingredients" id="recipe_ingredients" required></textarea>
                    </fieldset>
                    <button type="reset" id="add_recipe_modal_close_btn">
                        <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                        <path d="M14.5 9.50002L9.5 14.5M9.49998 9.5L14.5 14.5" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"/>
                        <path d="M7 3.33782C8.47087 2.48697 10.1786 2 12 2C17.5228 2 22 6.47715 22 12C22 17.5228 17.5228 22 12 22C6.47715 22 2 17.5228 2 12C2 10.1786 2.48697 8.47087 3.33782 7" stroke="#1C274C" stroke-width="1.5" stroke-linecap="round"/>
                        </svg>
                    </button>
                    <button type="submit" id="add_recipe_modal_submit_btn">
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none">
                    <path fill-rule="evenodd" clip-rule="evenodd" d="M18.1716 1C18.702 1 19.2107 1.21071 19.5858 1.58579L22.4142 4.41421C22.7893 4.78929 23 5.29799 23 5.82843V20C23 21.6569 21.6569 23 20 23H4C2.34315 23 1 21.6569 1 20V4C1 2.34315 2.34315 1 4 1H18.1716ZM4 3C3.44772 3 3 3.44772 3 4V20C3 20.5523 3.44772 21 4 21L5 21L5 15C5 13.3431 6.34315 12 8 12L16 12C17.6569 12 19 13.3431 19 15V21H20C20.5523 21 21 20.5523 21 20V6.82843C21 6.29799 20.7893 5.78929 20.4142 5.41421L18.5858 3.58579C18.2107 3.21071 17.702 3 17.1716 3H17V5C17 6.65685 15.6569 8 14 8H10C8.34315 8 7 6.65685 7 5V3H4ZM17 21V15C17 14.4477 16.5523 14 16 14L8 14C7.44772 14 7 14.4477 7 15L7 21L17 21ZM9 3H15V5C15 5.55228 14.5523 6 14 6H10C9.44772 6 9 5.55228 9 5V3Z" fill="#0F0F0F"/>
                    </svg>
                    <span id="save_btn_span">Save</span></button>
                </form>
            </dialog>
            <dialog id="clicked_recipe_modal"></dialog>
        <script src="script.js" type="module"></script>
    </main>
</body>
</html>
